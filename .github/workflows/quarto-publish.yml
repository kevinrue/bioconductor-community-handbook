# adapted from https://github.com/quarto-dev/quarto-actions/blob/main/examples/quarto-publish-example.yml

on:
  push:
    branches:
      - main

name: Render and Publish

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        
      - name: Initialize GitHub Pages branch
        run: |
          if ! git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            current_commit=$(git rev-parse HEAD)
            git checkout --orphan gh-pages
            git rm -rf .
            touch .nojekyll
            git add .nojekyll
            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Initialize GitHub Pages branch"
            if ! git push origin gh-pages; then
              git ls-remote --exit-code --heads origin gh-pages >/dev/null
            fi
            git checkout "$current_commit"
          fi

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # NOTE: If Publishing to GitHub Pages, set the permissions correctly (see top of this yaml)
      - name: Publish to GitHub Pages (and render) 
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # this secret is always available for github actions
