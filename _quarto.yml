project:
  type: book

book:
  title: "Bioconductor Community Handbook"
  favicon: images/favicon.ico
  repo-url: https://github.com/kevinrue/bioconductor-community-handbook
  repo-branch: main
  repo-actions: [edit, issue, source]
  repo-link-target: _blank
  author:
    - name: "Kevin Rue"
      affiliation: "Oxford University"
      orcid: "0000-0003-3899-3872"
  date: "2026-09-24"
  sidebar:
    collapse-level: 1
  chapters:
    - index.qmd
    - part: guide_software.qmd
      chapters:
        - guides/software/package_development.qmd
        - guides/software/package_maintenance.qmd
        - guides/software/package_peer_review.qmd
    - part: guide_communication.qmd
      chapters:
        - guides/communication/communicating_with_the_community.qmd
        - guides/communication/communicating_with_other_communities.qmd
    - part: guide_fair.qmd
      chapters:
        - guides/fair/interoperable_file_types.qmd
        - guides/fair/bioc_in_galaxy.qmd
        - guides/fair/bioc_in_nfcore.qmd
    - part: code_of_conduct.md
      chapters:
        - code_of_conduct/en-US.qmd
    - references.qmd
  appendices:
    - appendices/contributors.qmd
    - appendices/definitions.qmd

bibliography: references.bib

format:
  html:
    theme:
      - cosmo
      - custom.scss
