project:
  type: book

book:
  title: "Bioconductor Community Handbook"
  repo-url: https://github.com/kevinrue/bioconductor-community-handbook
  repo-branch: main
  repo-actions: [edit, issue, source]
  repo-link-target: _blank
  author:
    - name: "Kevin Rue"
      affiliation: "Oxford University"
      orcid: "0000-0003-3899-3872"
  date: "2026-09-24"
  sidebar:
    collapse-level: 1
  chapters:
    - index.qmd
    - part: "Guide to package development"
      chapters:
        - guide_package_development.qmd
    - part: "Guide to package maintenance"
      chapters:
        - guide_package_maintenance.qmd
    - part: "Guide to package peer review"
      chapters:
        - guide_package_peer_review.qmd
    - part: "Guide to communication"
      chapters:
        - guide_communication.qmd
        - communicating_across_communities.qmd
    - part: "Guide to FAIR"
      chapters:
        - guide_fair.qmd
        - interoperable_file_types.qmd
        - bioc_in_galaxy.qmd
        - bioc_in_nfcore.qmd
    - contributors.qmd
    - references.qmd
  appendices:
    - definitions.qmd

bibliography: references.bib

format:
  html:
    theme: cosmo
